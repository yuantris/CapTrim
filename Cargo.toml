[workspace]
resolver = "2"
members = [
    "crates/captrim-core",
    "crates/captrim-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuantris/CapTrim"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust TTF/TTC rasteriser: keeps text out of the cross-compiled FFmpeg and
# out of the platform's native code, so preview and export share one bitmap.
fontdue = "0.9"
# Only the exporter writes PNGs; the decoder side stays FFmpeg's business.
png = "0.18"

# NOTE: keep panic = "unwind". The FFI layer wraps every extern "C" entry
# point in catch_unwind; panic = "abort" would bypass that guard.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
